name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.3'
  NODE_VERSION: '22'
  WAILS_VERSION: v3.0.0-beta.12
  # Without cgo and with the server tag, nothing here links against GTK or
  # WebKit, so their minutes-long install is skipped. The release workflow
  # still builds the desktop app with them.
  CGO_ENABLED: '0'

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go test -tags server ./backend/...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - run: npm ci
        working-directory: frontend

      - run: wails3 task common:generate:bindings BUILD_FLAGS='-tags server'

      - run: npx ng test --watch=false
        working-directory: frontend

      - run: npx ng build
        working-directory: frontend

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come preinstalled. The tag must match
    # @playwright/test in frontend/package-lock.json.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - run: npm ci
        working-directory: frontend

      - run: wails3 task test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
