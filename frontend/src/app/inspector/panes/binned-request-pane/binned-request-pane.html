<app-inspector-header title="Deleted request" />

@if (request(); as req) {
  <div class="binned-request-panel">
    <div class="binned-request-card">
      <h3 class="binned-request-title">{{ req.name }}</h3>
      <div class="binned-request-meta">
        <span class="request-method" [attr.data-method]="req.method">
          {{ req.method }}
        </span>
        <span class="binned-request-url">{{ req.url }}</span>
      </div>
      <div class="binned-request-info">
        <span>Original collection: {{ req.original_collection_name || 'Deleted' }}</span>
        <span>Deleted: {{ req.deleted_at }}</span>
      </div>
      <div class="binned-request-actions">
        <button class="restore-button" type="button" (click)="openRestorePicker()">Restore</button>
        <button class="delete-button" type="button" (click)="deletePermanently()">Delete permanently</button>
      </div>
    </div>
  </div>
}

@if (restorePickerOpen() && request(); as req) {
  <app-restore-to-collection-dialog [binIds]="[req.id]" (closed)="restorePickerOpen.set(false)" />
}
