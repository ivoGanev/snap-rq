<app-inspector-header [title]="name()">
  @if (saveError()) {
    <span class="script-save-error">Not saved</span>
  }
</app-inspector-header>

<div class="script-pane">
  <div class="script-wip" role="note">
    <span class="script-wip-badge">WIP</span>
    <p class="script-wip-text">
      Scripts can't run yet. This feature is in progress, so if you'd like to see it sooner,
      consider <a class="script-wip-link" [href]="donateUrl" (click)="openDonate($event)">supporting development</a>.
    </p>
  </div>

  @if (loaded()) {
    <!-- loaded() goes false while switching scripts, so each script gets a fresh editor (and undo history). -->
    <app-code-editor
      class="script-editor"
      language="javascript"
      [text]="loadedText()"
      (textChange)="onTextChange($event)"
    />
  }
</div>
