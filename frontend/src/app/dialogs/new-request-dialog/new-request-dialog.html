<div class="overlay-backdrop" (click)="closed.emit()">
  <div class="overlay-panel new-request-dialog" (click)="$event.stopPropagation()">
    <div class="overlay-header">
      <h3 class="overlay-title">Add new request</h3>
      <button class="overlay-close" type="button" (click)="closed.emit()">Close</button>
    </div>

    <div class="overlay-body">
      <div class="request-mode-toggle">
        <button
          class="request-mode-button"
          type="button"
          [class.is-active]="mode() === 'manual'"
          (click)="setMode('manual')"
        >
          Manual
        </button>
        <button
          class="request-mode-button"
          type="button"
          [class.is-active]="mode() === 'curl'"
          (click)="setMode('curl')"
        >
          cURL
        </button>
      </div>

      @if (mode() === 'curl') {
        <label class="edit-field">
          <span class="edit-label">Name</span>
          <input
            class="edit-input"
            type="text"
            placeholder="Imported curl"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
          />
        </label>

        <label class="edit-field">
          <span class="edit-label">cURL command</span>
          <textarea
            class="edit-input edit-input--textarea"
            rows="8"
            placeholder="curl https://example.com/api"
            [ngModel]="curl()"
            (ngModelChange)="curl.set($event)"
          ></textarea>
        </label>
      } @else {
        <label class="edit-field">
          <span class="edit-label">Name</span>
          <input
            class="edit-input"
            type="text"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            (keydown.enter)="add()"
          />
        </label>

        <label class="edit-field">
          <span class="edit-label">URL</span>
          <input
            class="edit-input"
            type="text"
            placeholder="https://you-are-the.boss"
            [ngModel]="url()"
            (ngModelChange)="url.set($event)"
            (keydown.enter)="add()"
          />
        </label>

        <label class="edit-field">
          <span class="edit-label">Method</span>
          <select class="edit-select" [ngModel]="method()" (ngModelChange)="method.set($event)">
            @for (m of httpMethods; track m) {
              <option>{{ m }}</option>
            }
          </select>
        </label>
      }
    </div>

    <div class="overlay-footer">
      <button class="variable-add" type="button" (click)="add()">
        {{ mode() === 'curl' ? 'Import' : 'Add request' }}
      </button>
    </div>
  </div>
</div>
