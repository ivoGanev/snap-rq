@if (toasts.active(); as toast) {
  <div class="toast" role="status">
    <span class="toast-message">{{ toast.message }}</span>
    @if (toast.action) {
      <button class="toast-action" type="button" (click)="toasts.runAction()">
        {{ toast.action.label }}
      </button>
    }
    <button class="toast-close" type="button" aria-label="Dismiss" (click)="toasts.dismiss()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>
  </div>
}
