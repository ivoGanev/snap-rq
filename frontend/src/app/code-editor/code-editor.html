<div class="code-editor">
  <div class="code-editor-editor-wrap">
    <div #editor class="code-editor-editor"></div>

    <!-- In the overlay layer: a blurred ancestor would shift a fixed element. -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="dropdownOrigin()"
      [cdkConnectedOverlayOpen]="dropdownOpen()"
      [cdkConnectedOverlayPositions]="dropdownPositions"
      [cdkConnectedOverlayViewportMargin]="8"
      (overlayOutsideClick)="closeDropdown()"
    >
      <!-- Keeps the editor focused while picking, or its blur would close the list first. -->
      <div class="variable-dropdown" (mousedown)="$event.preventDefault()">
        @if (variables().length > 0) {
          @for (variable of variables(); track variable.key; let i = $index) {
            <button
              class="variable-option"
              type="button"
              [class.is-active]="i === dropdownIndex()"
              (click)="insertVariable(variable)"
            >
              {{ variable.key }}
            </button>
          }
        } @else {
          <div class="variable-empty">No environment variables</div>
        }
        <div class="variable-hint">Ctrl+Space to open</div>
      </div>
    </ng-template>
  </div>
</div>
