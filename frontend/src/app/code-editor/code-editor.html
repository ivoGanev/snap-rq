<div class="code-editor">
  <div class="code-editor-editor-wrap">
    <div #editor class="code-editor-editor"></div>

    @if (dropdownOpen()) {
      <div class="variable-dropdown" [style.top.px]="dropdownTop()" [style.left.px]="dropdownLeft()">
        @if (variables().length > 0) {
          @for (variable of variables(); track variable.key; let i = $index) {
            <button
              class="variable-option"
              type="button"
              [class.is-active]="i === dropdownIndex()"
              (click)="insertVariable(variable)"
            >
              {{ variable.key }}
            </button>
          }
        } @else {
          <div class="variable-empty">No environment variables</div>
        }
        <div class="variable-hint">Ctrl+Space to open</div>
      </div>
    }
  </div>
</div>
