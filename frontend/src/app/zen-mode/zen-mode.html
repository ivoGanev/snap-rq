<div class="titlebar-spacer"></div>

<div class="zen-header">
  <div class="zen-header-col zen-header-col--request">
    <button class="zen-back" type="button" (click)="close()" aria-label="Close edit mode">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </svg>
    </button>
    <h2 class="zen-pane-title">Request</h2>
    <button
      class="zen-send-button"
      type="button"
      (click)="state.sendRequest(state.selectedRequest()!, $event)"
    >
      Send
    </button>
  </div>
  <div class="zen-header-col zen-header-col--response">
    <h2 class="zen-pane-title">Response</h2>
  </div>
</div>

<div class="zen-panes">
  <div class="zen-pane zen-pane--request">
    <div class="zen-pane-content">
      <app-request-editor></app-request-editor>
    </div>
  </div>

  <div class="zen-pane zen-pane--response">
    <div class="zen-pane-content">
      <app-response-viewer></app-response-viewer>
    </div>
  </div>
</div>
