<button class="window-control" type="button" aria-label="Minimise" title="Minimise" (click)="minimise()">
  <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
</button>
<button
  class="window-control"
  type="button"
  [attr.aria-label]="maximised() ? 'Restore' : 'Maximise'"
  [title]="maximised() ? 'Restore' : 'Maximise'"
  (click)="toggleMaximise()"
>
  @if (maximised()) {
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5V.5h7v7h-2M.5 2.5h7v7h-7z" /></svg>
  } @else {
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5h9v9h-9z" /></svg>
  }
</button>
<button class="window-control window-control--close" type="button" aria-label="Close" title="Close" (click)="close()">
  <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9" /></svg>
</button>
