<div class="headers-editor-shell">
  @if (showLabel()) {
    <span class="headers-editor-label">Headers</span>
  }
  <app-code-editor
    class="code-editor-host"
    [text]="headers()"
    language="text"
    [variables]="variables()"
    (textChange)="headersChange.emit($event)"
  ></app-code-editor>
</div>
