@if (!showingBin()) {
  <div
    class="bottom-drawer"
    [class.is-open]="activeTab() !== null"
    [class.is-resizing]="resizing()"
    [style.height.px]="activeTab() ? drawerHeight() : 0"
  >
    <div class="bottom-drawer-inner">
      <div
        class="bottom-drawer-resize-handle"
        role="separator"
        aria-label="Resize drawer"
        (pointerdown)="startResize($event)"
        (pointermove)="resize($event)"
        (pointerup)="stopResize($event)"
        (pointercancel)="stopResize($event)"
      ></div>
      <button
        class="bottom-drawer-close"
          type="button"
          (click)="closeDrawer()"
          aria-label="Collapse drawer"
          title="Collapse"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (activeTab()) {
        <ng-container
          *ngComponentOutlet="activeTab()!.component"
        ></ng-container>
      }
    </div>
  </div>

  <div class="bottom-tabs">
    @for (tab of tabs(); track tab.id) {
      <button
        class="bottom-tab"
        type="button"
        [class.is-active]="isActive(tab)"
        (click)="selectTab(tab)"
      >
        <svg
          class="bottom-tab-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @switch (tab.icon) {
            @case ('body') {
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="14" y2="17" />
            }
            @case ('headers') {
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            }
          }
        </svg>
        <span class="bottom-tab-label">{{ tab.label }}</span>
      </button>
    }
    @if (showColors()) {
      <div class="color-picker" aria-label="Request colour">
        @for (color of colors; track color.hex) {
          <button
            class="color-dot"
            [class.is-active]="activeColor() === color.hex"
            type="button"
            [style.background-color]="color.hex"
            [title]="activeColor() === color.hex ? color.label + ' (click to clear)' : color.label"
            [attr.aria-label]="color.label"
            (click)="onColorClick(color.hex)"
          ></button>
        }
      </div>
    }
  </div>
}
