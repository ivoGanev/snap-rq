@if (draftRequest()) {
  <div class="edit-form">
    <div class="edit-fields">
      <label class="edit-field">
        <span class="edit-label">Name</span>
        <input
          class="edit-input"
          type="text"
          [ngModel]="draftRequest()!.name"
          (ngModelChange)="updateRequestField('name', $event)"
          name="reqName"
        />
      </label>

      <div class="edit-field">
        <span class="edit-label">URL</span>
        <app-code-editor
          class="edit-url-editor"
          language="text"
          [singleLine]="true"
          [text]="draftRequest()!.url"
          [variables]="environmentVariables()"
          (textChange)="updateRequestField('url', $event)"
        ></app-code-editor>
      </div>

      <label class="edit-field">
        <span class="edit-label">Method</span>
        <select
          class="edit-select"
          [ngModel]="draftRequest()!.method"
          (ngModelChange)="updateRequestField('method', $event)"
          name="reqMethod"
        >
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
          <option>PATCH</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
      </label>

      <div class="edit-field edit-field--headers">
        <app-request-headers-editor
          class="edit-headers-editor"
          [headers]="draftRequest()!.request_headers"
          [variables]="environmentVariables()"
          (headersChange)="updateRequestField('request_headers', $event)"
        ></app-request-headers-editor>
      </div>

      <div class="edit-field edit-field--body">
        <app-request-body-editor
          class="edit-body-editor"
          [body]="draftRequest()!.body"
          [type]="bodyEditorType()"
          [variables]="environmentVariables()"
          (bodyChange)="updateRequestField('body', $event)"
          (typeChange)="updateRequestField('body_type', $event)"
        ></app-request-body-editor>
      </div>

      @if (showTagInput() || (requestTags()[state.selectedRequest()!.id]?.length ?? 0) > 0) {
        <label class="edit-field">
          <span class="edit-label">Tags</span>
          <div class="request-tags request-tags--editable">
            @for (tag of requestTags()[state.selectedRequest()!.id] ?? []; track tag) {
              <span class="tag-chip tag-chip--editable">
                {{ tag }}
                <button
                  class="tag-chip-remove"
                  type="button"
                  (click)="removeTagFromRequest(state.selectedRequest()!, tag, $event)"
                  aria-label="Remove tag"
                >
                  ×
                </button>
              </span>
            }
          </div>
          @if (showTagInput()) {
            <div class="tag-input-wrap">
              <input
                class="tag-input"
                type="text"
                placeholder="Add tag…"
                [ngModel]="newTagName()"
                (ngModelChange)="newTagName.set($event)"
                (keydown.enter)="addTagToRequest(state.selectedRequest()!, newTagName())"
              />
              @if (tagSuggestions().length && newTagName().trim()) {
                <div class="tag-suggestions">
                  @for (tag of tagSuggestions(); track tag.id) {
                    <button
                      class="tag-suggestion"
                      type="button"
                      (click)="addTagToRequest(state.selectedRequest()!, tag.name)"
                    >
                      {{ tag.name }}
                    </button>
                  }
                </div>
              }
            </div>
          }
        </label>
      }
    </div>
  </div>
}
