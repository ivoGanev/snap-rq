@if (draftRequest()) {
  <div class="edit-form">
    <div class="edit-fields">
      <label class="edit-field">
        <span class="edit-label">Name</span>
        <input
          class="edit-input"
          type="text"
          [ngModel]="draftRequest()!.name"
          (ngModelChange)="updateRequestField('name', $event)"
          name="reqName"
        />
      </label>

      <div class="edit-field">
        <span class="edit-label">URL</span>
        <app-code-editor
          class="edit-url-editor"
          language="text"
          [singleLine]="true"
          [text]="draftRequest()!.url"
          [variables]="environmentVariables()"
          (textChange)="updateRequestField('url', $event)"
        ></app-code-editor>
      </div>

      <label class="edit-field">
        <span class="edit-label">Method</span>
        <select
          class="edit-select"
          [ngModel]="draftRequest()!.method"
          (ngModelChange)="updateRequestField('method', $event)"
          name="reqMethod"
        >
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
          <option>PATCH</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
      </label>

      <div class="edit-field edit-field--headers">
        <app-request-headers-editor
          class="edit-headers-editor"
          [framed]="true"
          [headers]="draftRequest()!.request_headers"
          [variables]="environmentVariables()"
          (headersChange)="updateRequestField('request_headers', $event)"
        ></app-request-headers-editor>
      </div>

      <div class="edit-field edit-field--body">
        <app-request-body-editor
          class="edit-body-editor"
          [framed]="true"
          [body]="draftRequest()!.body"
          [type]="bodyEditorType()"
          [bodyForm]="draftRequest()!.body_form"
          [variables]="environmentVariables()"
          (bodyChange)="updateRequestField('body', $event)"
          (typeChange)="onBodyTypeChange($event)"
          (formChange)="updateRequestField('body_form', $event)"
        ></app-request-body-editor>
      </div>

      @if (showScriptInput() || (requestScripts()[state.selectedRequest()!.id]?.length ?? 0) > 0) {
        <label class="edit-field">
          <span class="edit-label">Scripts</span>
          <div class="request-scripts request-scripts--editable">
            @for (script of requestScripts()[state.selectedRequest()!.id] ?? []; track script) {
              <span class="script-chip script-chip--editable">
                {{ script }}
                <button
                  class="script-chip-remove"
                  type="button"
                  (click)="removeScriptFromRequest(state.selectedRequest()!, script, $event)"
                  aria-label="Detach script"
                >
                  ×
                </button>
              </span>
            }
          </div>
          @if (showScriptInput()) {
            <div class="script-input-wrap">
              <input
                class="script-input"
                type="text"
                placeholder="Attach script…"
                [ngModel]="newScriptName()"
                (ngModelChange)="newScriptName.set($event)"
                (keydown.enter)="addScriptToRequest(state.selectedRequest()!, newScriptName())"
              />
              @if (scriptSuggestions().length && newScriptName().trim()) {
                <div class="script-suggestions">
                  @for (script of scriptSuggestions(); track script.id) {
                    <button
                      class="script-suggestion"
                      type="button"
                      (click)="addScriptToRequest(state.selectedRequest()!, script.name)"
                    >
                      {{ script.name }}
                    </button>
                  }
                </div>
              }
            </div>
          }
        </label>
      }
    </div>
  </div>
}
